spring.application.name=task-management-api
server.port=8080

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/${MYSQL_DATABASE:taskmanagement}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${SHOW_SQL:true}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.security.cookie.secure=${COOKIE_SECURE:false}

spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

app.scheduling.timezone=${SCHEDULING_TIMEZONE:Asia/Ho_Chi_Minh}
app.scheduling.deadline-reminder-cron=${DEADLINE_REMINDER_CRON:0 0 8 * * *}

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Mail Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_USERNAME:no-reply@taskmanagement.com}
app.mail.outbox-key=${MAIL_OUTBOX_KEY}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.auth.otp.expiration-minutes=5
app.auth.otp.cooldown-seconds=60
app.auth.otp.max-attempts=5

