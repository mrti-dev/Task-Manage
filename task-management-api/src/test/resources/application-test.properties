spring.datasource.url=jdbc:h2:mem:taskmanagement;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
jwt.secret=test-secret-key-with-at-least-thirty-two-bytes
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000
app.security.cookie.secure=false
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@example.com
spring.mail.password=testpassword
app.mail.outbox-key=test-mail-outbox-key-with-at-least-thirty-two-characters
app.mail.outbox-poll-ms=3600000
app.mail.outbox-immediate=false
app.frontend-url=http://localhost:5173
app.auth.otp.expiration-minutes=5
app.auth.otp.cooldown-seconds=60
app.auth.otp.max-attempts=5

